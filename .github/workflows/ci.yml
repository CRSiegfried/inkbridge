name: CI

# Lint + test + a device-free end-to-end proof on every push and PR (D4).
# `proof` is inkbridge's own manifest→stamp→readback self-test, so it exercises
# the compose/readback stack with no device and no human — free coverage the
# gate should not leave on the table.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

      - name: Proof (device-free end-to-end self-test)
        run: inkbridge proof tests/fixtures/sampler_form.manifest.json
