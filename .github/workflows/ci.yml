name: CI

# Lint + test + a device-free end-to-end proof on master pushes and every PR (D4).
# `proof` is inkbridge's own manifest→stamp→readback self-test, so it exercises
# the compose/readback stack with no device and no human — free coverage the
# gate should not leave on the table.

on:
  # Feature branches are covered by the pull_request trigger; restricting push
  # to master + release tags avoids running the gate twice per PR push.
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:

# Least privilege: the gate only reads the repo — no token write access.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

      - name: Proof (device-free end-to-end self-test)
        run: inkbridge proof tests/fixtures/sampler_form.manifest.json
