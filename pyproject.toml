[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkbridge"
version = "0.1.0"
description = "A control plane for the Supernote Manta: push documents, pull annotations, merge PDFs with notes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Christopher Siegfried" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "supernotelib>=0.7.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.0"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CRSiegfried/inkbridge"
Repository = "https://github.com/CRSiegfried/inkbridge"
Issues = "https://github.com/CRSiegfried/inkbridge/issues"

[project.scripts]
inkbridge = "inkbridge.cli:main"
inkbridge-mcp = "inkbridge.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inkbridge.compose" = ["fonts/*"]
"inkbridge" = ["py.typed"]
