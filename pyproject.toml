[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkbridge"
version = "0.1.0"
description = "A control plane for the Supernote Manta: push documents, pull annotations, merge PDFs with notes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Christopher Siegfried" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1",
    "supernotelib>=0.7.1",
    "sncloud>=0.2.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdfium2>=4.30", "numpy>=1.26"]

[project.scripts]
inkbridge = "inkbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
